services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - geo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  geo_data: